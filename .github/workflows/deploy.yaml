name: CI/CD - Build and GitOps Sync

on:
  workflow_dispatch:
  push:
    branches:
      - master
    # IMPORTANTE: Ignore a pasta de manifestos para evitar um loop infinito 
    # onde o commit do bot engatilha a pipeline novamente.
    paths-ignore:
      - 'k8s/**'

env:
  AWS_REGION: "us-east-1"                   # Ajuste para a sua região
  ECR_REPOSITORY: "gitops-api"    # Ajuste para o nome do seu repositório
  MANIFEST_PATH: "k8s/base/deployment.yaml" # Caminho do seu deployment

# Permissões necessárias para usar OIDC e commitar no repositório
permissions:
  id-token: write
  contents: write

jobs:
  build-and-deploy:
    name: Build, Push and Update Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          # O fetch-depth: 1 é suficiente se não for precisar de histórico do git
          fetch-depth: 1

      - name: Configurar Credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654654156336:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push da imagem Docker
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # Usando o SHA do commit como tag da imagem para rastreabilidade
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          # Exporta a imagem completa para ser usada no próximo passo
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Atualizar tag da imagem no Deployment
        env:
          NEW_IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          # Utiliza o sed para encontrar a linha da imagem e substituí-la.
          # Isso assume que no seu deployment.yaml existe uma linha no formato: image: <url>
          sed -i -E "s|(image: ).*|\1$NEW_IMAGE|" ${{ env.MANIFEST_PATH }}
          
      - name: Commit e Push das alterações para o ArgoCD
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.MANIFEST_PATH }}
          
          # A tag [skip ci] garante de forma redundante que esse commit não iniciará outro workflow
          git commit -m "chore: atualiza imagem da api para ${{ github.sha }} [skip ci]" || echo "Nenhuma alteração para commitar"
          git push origin main