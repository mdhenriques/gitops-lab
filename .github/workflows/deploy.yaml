name: CI/CD - Build and GitOps Sync

on:
  workflow_dispatch:
  push:
    branches:
      - master
    # IMPORTANT: Ignores documentation, manifests, and local configs
    # to avoid unnecessary runs and infinite bot commit loops.
    paths-ignore:
      - 'k8s/**'
      - 'argocd/**'
      - 'policies/**'
      - 'kind-config.yaml'
      - 'README.md'
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'LICENSE'

env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "gitops-api"
  MANIFEST_PATH: "k8s/base/deployment.yaml"
  # Rolling automation branch used for the image update PR
  DEPLOY_BRANCH: "automation/update-api-image"

# Prevent race conditions between concurrent builds: one at a time, without cancelling ongoing runs.
concurrency:
  group: gitops-deploy
  cancel-in-progress: false

# Permissions required for OIDC, publishing the automation branch, and opening PRs.
# Requires: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  iac-security:
    name: DevSecOps - IaC Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform and Kubernetes directories
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform,kubernetes
          output_format: cli
          soft_fail: true # Generates full report in log without failing experimental pipeline

  build-and-deploy:
    name: Build, Security Scan and GitOps Sync
    needs: [iac-security]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 1 is sufficient without git history requirements
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements*.txt

      - name: Run API Unit Tests (Pytest)
        run: |
          cd apps/api
          pip install -r requirements.txt -r requirements-dev.txt
          pytest test_main.py -v

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654654156336:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$FULL_IMAGE" >> $GITHUB_OUTPUT
          cd apps/api
          docker build -t "$FULL_IMAGE" .

      - name: DevSecOps - Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          format: 'table'
          exit-code: '0' # Informative report (use 1 to block if CRITICAL found)
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push image to Amazon ECR
        env:
          FULL_IMAGE: ${{ steps.build-image.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # If image already exists in ECR (e.g., on re-run), skip push to respect immutability
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "Image $FULL_IMAGE already exists in ECR. Skipping push (respecting immutable tag)."
          else
            docker push "$FULL_IMAGE"
          fi

      - name: Update image tag in Deployment manifest
        env:
          NEW_IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          # Use sed to find image line and replace it
          sed -i -E "s|(image: ).*|\1$NEW_IMAGE|" ${{ env.MANIFEST_PATH }}
          
      - name: Open/update Pull Request for ArgoCD
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          if git diff --quiet -- "$MANIFEST_PATH"; then
            echo "No changes in manifest; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Merging only touches k8s/** (covered by paths-ignore), preventing new build loops.
          git checkout -B "$DEPLOY_BRANCH"
          git add "$MANIFEST_PATH"
          git commit -m "chore: update api image to ${GITHUB_SHA}"

          # Single rolling branch: always reflects latest build, avoiding
          # conflicting PRs when multiple builds happen before merge.
          git push --force origin "$DEPLOY_BRANCH"

          TITLE="chore: update api image to ${GITHUB_SHA::7}"
          BODY=$(printf 'Automated deployment image update.\n\n- Image: `%s`\n- Source Commit: %s\n- Workflow: %s/%s/actions/runs/%s' \
            "$NEW_IMAGE" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          if gh pr view "$DEPLOY_BRANCH" --json state --jq '.state' 2>/dev/null | grep -q '^OPEN$'; then
            gh pr edit "$DEPLOY_BRANCH" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base master --head "$DEPLOY_BRANCH" --title "$TITLE" --body "$BODY"
          fi