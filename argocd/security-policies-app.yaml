# ArgoCD Application that synchronizes Kyverno security policies (DevSecOps)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mdhenriques/gitops-lab.git
    targetRevision: master
    path: policies/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
