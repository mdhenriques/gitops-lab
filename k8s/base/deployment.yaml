apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-api
  labels:
    app: gitops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-api
  template:
    metadata:
      labels:
        app: gitops-api
    spec:
      imagePullSecrets:
      - name: ecr-cred
      containers:
      - name: api
        image: 654654156336.dkr.ecr.us-east-1.amazonaws.com/gitops-api
        imagePullPolicy: Always
        env:
        - name: DB_CONNECTION
          valueFrom:
            secretKeyRef:
              name: api-db-secret
              key: DB_CONNECTION
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
