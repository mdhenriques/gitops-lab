apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-api
  labels:
    app: gitops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-api
  template:
    metadata:
      labels:
        app: gitops-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      # Boas praticas de seguranca (CIS Benchmark & Checkov)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: ecr-cred
      containers:
      - name: api
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        image: 654654156336.dkr.ecr.us-east-1.amazonaws.com/gitops-api:275763e9de566755705befe4ffed4f87ebf127ce
        imagePullPolicy: Always
        env:
        - name: DB_CONNECTION
          valueFrom:
            secretKeyRef:
              name: api-db-secret
              key: DB_CONNECTION
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
