# Mantem o imagePullSecret "ecr-cred" (referenciado no deployment.yaml) sempre
# atualizado. O token do ECR expira em 12h; o refresh de 30m garante renovacao
# bem antes disso, sem CronJob nem criacao manual do Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ecr-cred
  namespace: default
spec:
  refreshInterval: "30m"
  target:
    name: ecr-cred
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .proxy_endpoint }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ClusterGenerator
        name: ecr-authorization-token
