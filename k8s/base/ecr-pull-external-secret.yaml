# Keeps the imagePullSecret "ecr-cred" (referenced in deployment.yaml) continuously
# updated. ECR tokens expire in 12h; 30m refresh ensures renewal well in advance,
# without CronJobs or manual Secret management.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ecr-cred
spec:
  refreshInterval: "30m"
  target:
    name: ecr-cred
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .proxy_endpoint }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ClusterGenerator
        name: ecr-authorization-token
