apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-db-credentials
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: api-db-secret
  data:
  - secretKey: DB_CONNECTION
    remoteRef:
      key: gitops-db-connection
